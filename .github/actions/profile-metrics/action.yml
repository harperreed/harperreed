# ABOUTME: Render one profile card with the approved Metrics compatibility fixes.
# ABOUTME: Share card settings and reuse the source-built image across render steps.

name: Render profile card
description: Generate and commit one GitHub profile metrics card.

inputs:
    card:
        description: Card name and SVG basename.
        required: true
    base:
        description: Metrics base sections to display.
        default: ""
    token:
        description: Scopeless classic token for public GitHub data.
        required: true

runs:
    using: composite
    steps:
        - uses: lowlighter/metrics@1e49d0b8b932624dd7762147e35ccc137eda09f1 # upstream PR 1834
          with:
              use_prebuilt_image: no
              token: ${{ inputs.token }}
              committer_token: ${{ github.token }}
              committer_branch: ${{ github.ref_name }}
              user: harperreed
              filename: metrics/${{ inputs.card }}.svg
              template: classic
              base: ${{ inputs.base }}
              repositories: 20
              repositories_batch: 20
              config_timezone: America/Chicago
              plugins_errors_fatal: yes
              retries_delay: 10
              plugin_isocalendar: ${{ inputs.card == 'calendar' }}
              plugin_isocalendar_duration: half-year
              plugin_followup: ${{ inputs.card == 'languages' }}
              plugin_languages: ${{ inputs.card == 'languages' }}
              plugin_habits: ${{ inputs.card == 'habits' }}
              plugin_habits_from: 200
              plugin_habits_days: 14
              plugin_habits_charts: yes
              plugin_habits_trim: yes
              plugin_achievements: ${{ inputs.card == 'achievements' }}
              plugin_achievements_threshold: B
              plugin_achievements_secrets: yes
              plugin_achievements_display: compact
              plugin_achievements_limit: 0
