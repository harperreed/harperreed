# ABOUTME: Generate the seven GitHub profile cards shown in the README.
# ABOUTME: Refresh public metrics daily with dates and habits in Chicago time.

name: Profile Metrics

on:
    push:
        paths:
            - .github/workflows/metrics.yml
            - content/github_stats.md
    workflow_dispatch:
    schedule:
        - cron: "47 6 * * *"

concurrency:
    group: profile-metrics-${{ github.ref }}
    cancel-in-progress: false

jobs:
    metrics:
        name: ${{ matrix.card }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                include:
                    - card: header
                      filename: metrics/header.svg
                      base: header
                    - card: repositories
                      filename: metrics/repositories.svg
                      base: repositories
                    - card: activity
                      filename: metrics/activity.svg
                      base: activity, community
                    - card: calendar
                      filename: metrics/calendar.svg
                      base: ""
                    - card: languages
                      filename: metrics/languages.svg
                      base: ""
                    - card: habits
                      filename: metrics/habits.svg
                      base: ""
                    - card: achievements
                      filename: metrics/achievements.svg
                      base: ""
        steps:
            - name: Check metrics token
              env:
                  METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
              run: |
                  if [[ -z "$METRICS_TOKEN" ]]; then
                      echo "::error::Add the METRICS_TOKEN secret; see docs/profile-metrics.md."
                      exit 1
                  fi

            - name: Render and commit card
              uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest
              with:
                  token: ${{ secrets.METRICS_TOKEN }}
                  committer_token: ${{ github.token }}
                  committer_branch: ${{ github.ref_name }}
                  user: harperreed
                  filename: ${{ matrix.filename }}
                  template: classic
                  base: ${{ matrix.base }}
                  config_timezone: America/Chicago
                  plugins_errors_fatal: yes
                  debug: ${{ matrix.card == 'repositories' }}
                  plugin_isocalendar: ${{ matrix.card == 'calendar' }}
                  plugin_isocalendar_duration: half-year
                  plugin_followup: ${{ matrix.card == 'languages' }}
                  plugin_languages: ${{ matrix.card == 'languages' }}
                  plugin_habits: ${{ matrix.card == 'habits' }}
                  plugin_habits_from: 200
                  plugin_habits_days: 14
                  plugin_habits_charts: yes
                  plugin_habits_trim: yes
                  plugin_achievements: ${{ matrix.card == 'achievements' }}
                  plugin_achievements_threshold: B
                  plugin_achievements_secrets: yes
                  plugin_achievements_display: compact
                  plugin_achievements_limit: 0
